[alembic]
script_location = alembic
# URL solo para render OFFLINE (`alembic upgrade head --sql`); el online usa
# app.core.settings (asyncpg). Nunca poner secretos reales (R7).
sqlalchemy.url = postgresql+psycopg2://turnos:turnos@localhost:5432/turnos

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
